<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Smart Home - Login</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-overlay">
        <div class="login-card">
            <div class="login-icon">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <h1>Smart Home</h1>
            
            <form id="login-form">
                <p>Secure Access</p>
                <div class="form-group">
                    <input type="email" id="email" class="input-field" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="password" class="input-field" placeholder="Password" required>
                </div>
                <button type="submit" class="btn-primary">Log In</button>
                <p class="auth-switch" onclick="toggleAuth('register')">Need an account? Sign up</p>
            </form>

            <form id="register-form" class="hidden">
                <p>Create Account</p>
                <div class="form-group">
                    <input type="email" id="reg-email" class="input-field" placeholder="New Email" required>
                </div>
                <div class="form-group">
                    <input type="password" id="reg-password" class="input-field" placeholder="New Password" required>
                </div>
                <button type="submit" class="btn-primary" style="background-color: var(--success-color);">Sign Up</button>
                <p class="auth-switch" onclick="toggleAuth('login')">Have an account? Log In</p>
            </form>

            <h5 id="auth-msg" class="error-msg hidden"></h5>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
