<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>Smart Home - Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- <script src="theme.js"></script> -->
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div>
                <p id="date-display">Fetching date...</p>
                <h2>My Home</h2>
            </div>
            <div class="user-avatar" onclick="logout()">
                <i class="fa-solid fa-right-from-bracket" style="color: #ef4444;"></i>
            </div>
        </header>

        <div class="content-area">
            <div class="stats-row">
                <div class="stat-card">
                    <div class="stat-icon bg-orange"><i class="fa-solid fa-temperature-half"></i></div>
                    <div><p class="stat-label">TEMP</p><p class="stat-val">24°C</p></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon bg-blue"><i class="fa-solid fa-droplet"></i></div>
                    <div><p class="stat-label">HUMIDITY</p><p class="stat-val">45%</p></div>
                </div>
            </div>

            <h3 class="section-title">Devices</h3>
            <div id="device-grid" class="device-grid"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="home.html" class="nav-btn active">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="energy.html" class="nav-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Energy</span>
                </a>

                <a href="settings.html" class="nav-btn">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Device Settings</h3>
                <button onclick="closeModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="modal-section">
                <label>Device Name</label>
                <div class="input-with-icon">
                    <input type="text" id="edit-name" placeholder="Enter Name">
                    <i class="fa-solid fa-pen"></i>
                </div>
            </div>

            <div class="modal-section" style="margin-top:15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Device Type</label>
                <div class="type-grid">
                        <div class="type-option" onclick="selectType('light')" data-type="light">
                            <i class="fa-solid fa-lightbulb"></i><span>Light</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('fan')" data-type="fan">
                            <i class="fa-solid fa-fan"></i><span>Fan</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('ac')" data-type="ac">
                            <i class="fa-solid fa-snowflake"></i><span>AC</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('tv')" data-type="tv">
                            <i class="fa-solid fa-tv"></i><span>TV</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('wifi')" data-type="wifi">
                            <i class="fa-solid fa-wifi"></i><span>WiFi</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('socket')" data-type="socket">
                            <i class="fa-solid fa-plug"></i><span>Socket</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('water')" data-type="water">
                            <i class="fa-solid fa-faucet-drip"></i><span>Pump</span>
                        </div>
                        
                        <div class="type-option" onclick="selectType('laundry')" data-type="laundry">
                            <i class="fa-solid fa-shirt"></i><span>Wash</span>
                        </div>
                    </div>
            <div class="modal-section">
                <label>Auto Turn Off</label>
                <div class="timer-row">
                    <input type="number" id="timer-hrs" placeholder="0"><span>Hr</span>
                    <input type="number" id="timer-mins" placeholder="0"><span>Min</span>
                    <button onclick="setTimer()" class="btn-timer">Set</button>
                </div>
            </div>

            <button onclick="saveChanges()" class="btn-primary" style="margin-top: 20px;">Save Changes</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
