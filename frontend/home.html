<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header style="align-items: center;">
            <div>
                <p id="date-display" style="margin-bottom: 4px;">Fetching date...</p>
                <h2 id="dashboard-title" style="margin-bottom: 0;">My Home</h2>
            </div>
            
            <div onclick="openSensorModal()" style="background: #ffffff; padding: 10px 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform 0.1s;">
                
                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 28px; height: 28px; border-radius: 50%; background: #ffedd5; display: flex; align-items: center; justify-content: center; color: #f97316;">
                        <i class="fa-solid fa-temperature-half" style="font-size: 0.8rem;"></i>
                    </div>
                    <span id="temp-display" style="font-weight: 700; color: #111827; font-size: 0.95rem;">--°C</span>
                </div>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <div style="width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                        <i class="fa-solid fa-droplet" style="font-size: 0.8rem;"></i>
                    </div>
                    <span id="hum-display" style="font-weight: 700; color: #111827; font-size: 0.95rem;">--%</span>
                </div>

            </div>
        </header>

        <div class="content-area no-scroll">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3 class="section-title" style="margin-bottom: 0;">Devices</h3>
                <div class="view-toggles">
                    <div id="btn-list" onclick="setView('list')" class="toggle-btn">
                        <i class="fa-solid fa-list"></i>
                    </div>
                    <div id="btn-grid" onclick="setView('grid')" class="toggle-btn active">
                        <i class="fa-solid fa-border-all"></i>
                    </div>
                </div>
            </div>
            
            <div id="device-grid" class="device-grid"></div>
        </div>

        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="home.html" class="nav-btn active">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="energy.html" class="nav-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Energy</span>
                </a>

                <a href="settings.html" class="nav-btn">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>
    </div>
<div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Device Settings</h3>
                <button onclick="closeModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="modal-section">
                <label>Device Name</label>
                <div class="input-with-icon">
                    <input type="text" id="edit-name" maxlength="20" placeholder="Enter Name">
                    <i class="fa-solid fa-pen"></i>
                </div>
            </div>

            <div class="modal-section" style="margin-top:15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Device Type</label>
                <div class="type-grid">
                    <div class="type-option" onclick="selectType('light')" data-type="light">
                        <i class="fa-solid fa-lightbulb"></i><span>Light</span>
                    </div>
                    <div class="type-option" onclick="selectType('fan')" data-type="fan">
                        <i class="fa-solid fa-fan"></i><span>Fan</span>
                    </div>
                    <div class="type-option" onclick="selectType('ac')" data-type="ac">
                        <i class="fa-solid fa-snowflake"></i><span>AC</span>
                    </div>
                    <div class="type-option" onclick="selectType('tv')" data-type="tv">
                        <i class="fa-solid fa-tv"></i><span>TV</span>
                    </div>
                    <div class="type-option" onclick="selectType('wifi')" data-type="wifi">
                        <i class="fa-solid fa-wifi"></i><span>WiFi</span>
                    </div>
                    <div class="type-option" onclick="selectType('socket')" data-type="socket">
                        <i class="fa-solid fa-plug"></i><span>Socket</span>
                    </div>
                    <div class="type-option" onclick="selectType('water')" data-type="water">
                        <i class="fa-solid fa-faucet-drip"></i><span>Pump</span>
                    </div>
                    <div class="type-option" onclick="selectType('laundry')" data-type="laundry">
                        <i class="fa-solid fa-shirt"></i><span>Wash</span>
                    </div>
                </div> </div>

            <div class="modal-section">
                <label>Auto Turn Off</label>
                <div class="timer-row">
                    <input type="number" maxlength="3" id="timer-hrs" placeholder="0"><span>Hr</span>
                    <input type="number" maxlength="3" id="timer-mins" placeholder="0"><span>Min</span>
                    <button onclick="setTimer()" class="btn-timer">Set</button>
                </div>
            </div>

            <button onclick="saveChanges()" class="btn-primary" style="margin-top: 20px;">Save Changes</button>
        </div> </div> <div id="sensor-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Select Primary Sensor</h3>
                <button onclick="closeSensorModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div id="sensor-list" style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;">
                </div>

            <button onclick="saveSensorSelection()" class="btn-primary" style="margin-top: 15px;">Set as Main Sensor</button>
        </div>
    </div>

    <script src="app.js?v=2"></script>
</body>
</html>
