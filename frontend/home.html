<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Dashboard</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>

<body>
    <div class="dashboard-container">
        <header style="align-items: center;">
            <div>
                <p id="date-display" style="margin-bottom: 4px;">Fetching date...</p>
                <h2 id="dashboard-title" style="margin-bottom: 0;">My Home</h2>
            </div>

            <div onclick="openSensorModal()"
                style="background: #ffffff; padding: 10px 15px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); cursor: pointer; display: flex; flex-direction: column; gap: 8px; transition: transform 0.1s;">

                <div style="display: flex; align-items: center; gap: 10px;">
                    <div
                        style="width: 28px; height: 28px; border-radius: 50%; background: #ffedd5; display: flex; align-items: center; justify-content: center; color: #f97316;">
                        <i class="fa-solid fa-temperature-half" style="font-size: 0.8rem;"></i>
                    </div>
                    <span id="temp-display" style="font-weight: 700; color: #111827; font-size: 0.95rem;">--°C</span>
                </div>

                <div style="display: flex; align-items: center; gap: 10px;">
                    <div
                        style="width: 28px; height: 28px; border-radius: 50%; background: #dbeafe; display: flex; align-items: center; justify-content: center; color: #3b82f6;">
                        <i class="fa-solid fa-droplet" style="font-size: 0.8rem;"></i>
                    </div>
                    <span id="hum-display" style="font-weight: 700; color: #111827; font-size: 0.95rem;">--%</span>
                </div>

            </div>
        </header>

        <div class="content-area">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <h3 class="section-title" style="margin-bottom: 0;">Devices</h3>
                    <button id="refresh-btn" onclick="refreshDevices()" style="background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.3); cursor: pointer; color: #ffffff; width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; transition: all 0.3s ease; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 0; outline: none;" onmouseover="this.style.background='rgba(255, 255, 255, 0.3)'; this.style.boxShadow='0 6px 14px rgba(0, 0, 0, 0.2)';" onmouseout="this.style.background='rgba(255, 255, 255, 0.18)'; this.style.boxShadow='0 4px 10px rgba(0, 0, 0, 0.15)';">
                        <i class="fa-solid fa-arrows-rotate" style="font-size: 0.9rem;"></i>
                    </button>
                </div>
                <div class="view-toggles">
                    <div id="btn-list" onclick="setView('list')" class="toggle-btn">
                        <i class="fa-solid fa-list"></i>
                    </div>
                    <div id="btn-grid" onclick="setView('grid')" class="toggle-btn active">
                        <i class="fa-solid fa-border-all"></i>
                    </div>
                </div>
            </div>

            <div id="favorites-section" style="display: none;">
                <h3 class="section-title" style="margin-top: 10px; margin-bottom: 10px; font-size: 1.1rem; color: #f59e0b;"><i class="fa-solid fa-star"></i> Favorites</h3>
                <div id="favorites-grid" class="device-grid"></div>
            </div>

            <div id="all-devices-section">
                <h3 id="all-devices-title" class="section-title" style="margin-top: 15px; margin-bottom: 10px; font-size: 1.1rem; display: none;">All Devices</h3>
                <div id="device-grid" class="device-grid"></div>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="home.html" class="nav-btn active">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>

                <a href="energy.html" class="nav-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Energy</span>
                </a>

                <a href="settings.html" class="nav-btn">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>
    </div>
    <div id="edit-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Device Settings</h3>
                <button onclick="closeModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div class="modal-section">
                <label>Device Name</label>
                <div class="input-with-icon">
                    <input type="text" id="edit-name" maxlength="20" placeholder="Enter Name">
                    <i class="fa-solid fa-pen"></i>
                </div>
            </div>

            <div class="modal-section" style="margin-top:15px;">
                <label style="display:block; margin-bottom:5px; font-weight:600;">Device Type</label>
                <div class="type-grid">
                    <div class="type-option" onclick="selectType('light')" data-type="light">
                        <i class="fa-solid fa-lightbulb"></i><span>Light</span>
                    </div>
                    <div class="type-option" onclick="selectType('fan')" data-type="fan">
                        <i class="fa-solid fa-fan"></i><span>Fan</span>
                    </div>
                    <div class="type-option" onclick="selectType('ac')" data-type="ac">
                        <i class="fa-solid fa-snowflake"></i><span>AC</span>
                    </div>
                    <div class="type-option" onclick="selectType('outlet')" data-type="outlet">
                        <i class="fa-solid fa-plug"></i><span>Outlet</span>
                    </div>
                    <div class="type-option" onclick="selectType('wifi')" data-type="wifi">
                        <i class="fa-solid fa-wifi"></i><span>WiFi</span>
                    </div>
                    <div class="type-option" onclick="selectType('water')" data-type="water">
                        <i class="fa-solid fa-faucet-drip"></i><span>Pump</span>
                    </div>
                    <div class="type-option" onclick="selectType('laundry')" data-type="laundry">
                        <i class="fa-solid fa-shirt"></i><span>Wash</span>
                    </div>
                    <div class="type-option" onclick="selectType('other')" data-type="other">
                        <i class="fa-solid fa-bolt"></i><span>Other</span>
                    </div>
                </div>
            </div>

            <!-- Fan Speed — only visible when type = fan -->
            <div id="fan-speed-section" class="modal-section hidden">
                <label>Fan Speed</label>
                <div class="modal-speed-wrap">
                    <input type="range" id="modal-fan-speed" min="1" max="4" step="1" value="1" class="speed-slider">
                    <div class="speed-labels">
                        <span>Low</span><span>Mid</span><span>High</span><span>Turbo</span>
                    </div>
                </div>
                <div id="modal-speed-label"
                    style="text-align:center;font-size:0.8rem;color:#3b82f6;font-weight:700;margin-top:4px;">Low</div>
            </div>

            <div class="modal-section">
                <label>Auto Turn Off</label>

                <div id="timer-input-ui" class="timer-row">
                    <input type="number" maxlength="3" id="timer-hrs" placeholder="0"><span>Hr</span>
                    <input type="number" maxlength="3" id="timer-mins" placeholder="0"><span>Min</span>
                    <button onclick="setTimer()" class="btn-timer">Set</button>
                </div>

                <div id="timer-active-ui" class="hidden"
                    style="display: flex; justify-content: space-between; align-items: center; background: #f3f4f6; padding: 10px 15px; border-radius: 8px; border: 1px solid #e5e7eb;">
                    <div style="display:flex; align-items:center; gap:10px;">
                        <i class="fa-solid fa-clock" style="color:#f59e0b;"></i>
                        <span id="timer-countdown" style="font-weight: 600; color: #374151;">--m left</span>
                    </div>
                    <button onclick="cancelTimer()" title="Cancel Timer" class="close-btn">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="modal-section" style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
                <div style="display: flex; align-items: center; gap: 8px;">
                    <i class="fa-solid fa-star" style="color: #f59e0b;"></i>
                    <label style="margin-bottom: 0; font-weight: 600;">Include in Favorites</label>
                </div>
                <label class="ios-toggle">
                    <input type="checkbox" id="edit-favorite">
                    <span class="ios-slider"></span>
                </label>
            </div>

            <button onclick="saveChanges()" class="btn-primary" style="margin-top: 20px;">Save Changes</button>
        </div>
    </div>
    <div id="sensor-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3>Select Primary Sensor</h3>
                <button onclick="closeSensorModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="sensor-list"
                style="display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto;">
            </div>

            <button onclick="saveSensorSelection()" class="btn-primary" style="margin-top: 15px;">Set as Main
                Sensor</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.4/socket.io.min.js"></script>
    <script src="apiConfig.js"></script>
    <script src="app.js?v=2"></script>
</body>

</html>
