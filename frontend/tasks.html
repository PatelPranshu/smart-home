<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Home - Tasks</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="theme.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <header style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Automations</h2>
            <button class="add-task-btn-main" onclick="openTaskModal()" style="background: #3b82f6; color: white; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1.2rem; cursor: pointer;">
                <i class="fa-solid fa-plus"></i>
            </button>
        </header>

        <div class="content-area">
            <div id="tasks-list" class="tasks-list" style="margin-bottom: 150px; display: flex; flex-direction: column; gap: 15px; padding-top: 10px;">
                <p style="text-align: center; color: #999; margin-top: 50px;">Loading schedules...</p>
            </div>
        </div>

        <div class="bottom-nav">
            <div class="nav-inner">
                <a href="home.html" class="nav-btn">
                    <i class="fa-solid fa-house"></i>
                    <span>Home</span>
                </a>
                <a href="tasks.html" class="nav-btn active">
                    <i class="fa-solid fa-clock"></i>
                    <span>Tasks</span>
                </a>
                <a href="energy.html" class="nav-btn">
                    <i class="fa-solid fa-bolt"></i>
                    <span>Energy</span>
                </a>
                <a href="settings.html" class="nav-btn">
                    <i class="fa-solid fa-gear"></i>
                    <span>Settings</span>
                </a>
            </div>
        </div>
    </div>

    <div id="task-modal" class="modal-overlay hidden" style="color:black">
        <div class="modal-card">
            <div class="modal-header">
                <h3>New Schedule</h3>
                <button onclick="closeTaskModal()" class="close-btn"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <label class="modal-label">Select Appliance</label>
            <select id="task-device-select" class="input-field"></select>

            <div style="display: flex; gap: 15px; margin-top: 15px;">
                <div style="flex: 1;">
                    <label class="modal-label">ON Time</label>
                    <input type="time" id="task-on" class="input-field">
                </div>
                <div style="flex: 1;">
                    <label class="modal-label">OFF Time</label>
                    <input type="time" id="task-off" class="input-field">
                </div>
            </div>

            <label class="modal-label" style="margin-top: 15px; display: block;">Repeat Days</label>
            <div class="days-selector" style="display: flex; justify-content: space-between; margin-top: 10px;">
                <button class="day-btn" data-day="1">M</button>
                <button class="day-btn" data-day="2">T</button>
                <button class="day-btn" data-day="3">W</button>
                <button class="day-btn" data-day="4">T</button>
                <button class="day-btn" data-day="5">F</button>
                <button class="day-btn" data-day="6">S</button>
                <button class="day-btn" data-day="0">S</button>
            </div>

            <button onclick="saveTask()" class="btn-primary" style="margin-top: 25px;">Create Schedule</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
